name: daily-watchlist

on:
  schedule:
    - cron: "10 1 * * *" # 每天 UTC 01:10（北京时间 09:10）
  workflow_dispatch: {}

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install deps
        run: npm ci || npm install

      - name: Refresh top holders -> Helius webhook
        env:
          TOKEN_ADDRESS: ${{ secrets.TOKEN_ADDRESS }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BIRDEYE_API_KEY: ${{ secrets.BIRDEYE_API_KEY }}
          HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
          HELIUS_WEBHOOK_ID: ${{ secrets.HELIUS_WEBHOOK_ID }}
        run: npm run update-watchlist
# 注：workflow 索引依赖 push 事件，本注释用于触发注册
